name: RS APP - Legislation Radar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-test:
    name: Supabase scheduler token diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Verify scheduler authorization
        shell: bash
        env:
          SCHEDULER_TOKEN: ${{ secrets.RS_LEGISLATION_SCHEDULER_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$SCHEDULER_TOKEN" ]; then
            echo "FAIL - Scheduler token missing."
            exit 1
          fi

          URL="https://jcxdlsoxgluuxifhzxxy.supabase.co/functions/v1/legislation-radar-scheduled"

          HTTP_STATUS=$(curl --silent --show-error \
            --output response.json \
            --write-out "%{http_code}" \
            --max-time 30 \
            --request POST \
            --header "x-rs-scheduler-token: $SCHEDULER_TOKEN" \
            --header "x-rs-radar-test: auth_test" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "$URL")

          echo "HTTP status: $HTTP_STATUS"

          python3 - <<'PY'
          import json

          with open("response.json", encoding="utf-8") as f:
              data = json.load(f)

          if (
              data.get("ok") is True
              and data.get("auth_test") is True
              and data.get("authorization") == "scheduler_token"
              and data.get("radar_executed") is False
              and data.get("database_write") is False
          ):
              print("PASS - Scheduler token authorized.")
          else:
              print("FAIL - Unexpected diagnostic response.")
              print("Error code:", data.get("code", "not provided"))
              raise SystemExit(1)
          PY

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "FAIL - HTTP status is not 200."
            exit 1
          fi
