name: RS APP - Legislation Radar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-test:
    name: Supabase authorization diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Verify authorized connection
        shell: bash
        env:
          RADAR_SERVICE_KEY: ${{ secrets.RS_LEGISLATION_RADAR_SERVICE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$RADAR_SERVICE_KEY" ]; then
            echo "FAIL - GitHub Secret is missing."
            exit 1
          fi

          URL="https://jcxdlsoxgluuxifhzxxy.supabase.co/functions/v1/legislation-radar-scheduled"

          HTTP_STATUS=$(curl --silent --show-error \
            --output response.json \
            --write-out "%{http_code}" \
            --max-time 30 \
            --request POST \
            --header "Authorization: Bearer $RADAR_SERVICE_KEY" \
            --header "apikey: $RADAR_SERVICE_KEY" \
            --header "x-rs-radar-test: auth_test" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "$URL")

          echo "HTTP status: $HTTP_STATUS"

          python3 - <<'PY'
          import json

          try:
              with open("response.json", encoding="utf-8") as f:
                  data = json.load(f)

              if not isinstance(data, dict):
                  print("Response is not a JSON object.")
              else:
                  print("Error code:", data.get("code", "not provided"))
                  print("Error type:", data.get("error", "not provided"))
                  print("Auth test:", data.get("auth_test", "not provided"))
                  print("Radar executed:", data.get("radar_executed", "not provided"))
                  print("Database write:", data.get("database_write", "not provided"))
          except Exception:
              print("Response could not be parsed.")
          PY

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "PASS - Authorization diagnostic successful."
          else
            echo "FAIL - Authorization diagnostic unsuccessful."
            exit 1
          fi
